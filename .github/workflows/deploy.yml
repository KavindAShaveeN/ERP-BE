name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token AWS trusts
  contents: read

jobs:
  show-oidc-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub context values
        run: |
          echo "Owner (account/org): ${{ github.repository_owner }}"
          echo "Repository:          ${{ github.repository }}"
          echo "Ref:                 ${{ github.ref }}"
          echo "Event:               ${{ github.event_name }}"

      - name: Show OIDC token claims (copy 'sub' into the IAM trust policy)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"

          # Decode the JWT payload (base64url, unpadded); print claims only, never the token
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner, ref, job_workflow_ref}'
