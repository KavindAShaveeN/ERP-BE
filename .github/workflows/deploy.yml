
name: Spring Boot CI/CD to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rr-erp-trial-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      EB_APPLICATION_NAME: rr-erp-backend
      EB_ENVIRONMENT_NAME: rr-erp-backend-env
      EB_DEPLOY_BUCKET: elasticbeanstalk-ap-south-1-483379346725
      AWS_DEPLOY_ROLE_ARN: arn:aws:iam::483379346725:role/rr-erp-github-actions-deploy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean verify

      - name: Prepare deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE=$(find target -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name 'original-*' \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "Executable JAR not found"
            exit 1
          fi

          mkdir -p deployment
          cp "$JAR_FILE" deployment/application.jar
          cp Procfile deployment/Procfile

          cd deployment
          zip -q -r ../deployment.zip application.jar Procfile

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LABEL="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          S3_KEY="releases/${VERSION_LABEL}.zip"

          aws s3 cp deployment.zip \
            "s3://${EB_DEPLOY_BUCKET}/${S3_KEY}"

          echo "VERSION_LABEL=${VERSION_LABEL}" >> "$GITHUB_ENV"
          echo "S3_KEY=${S3_KEY}" >> "$GITHUB_ENV"

      - name: Register Elastic Beanstalk version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle \
              "S3Bucket=${EB_DEPLOY_BUCKET},S3Key=${S3_KEY}" \
            --process

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for deployment to finish
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT_NAME"

      - name: Check deployment status
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --query \
              'Environments[0].[Status,Health,VersionLabel]' \
            --output table
