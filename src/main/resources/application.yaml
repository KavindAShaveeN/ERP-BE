server:
  # Elastic Beanstalk's Java SE platform expects port 5000; override with SERVER_PORT
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: erp
  config:
    # Local dev: load DB_URL etc. from a .env file in the project root, if present
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    # Set DB_URL, DB_USERNAME and DB_PASSWORD per environment (EB environment properties, or locally)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Schema is managed by the SQL scripts in db/, never by Hibernate
      ddl-auto: none
    show-sql: true
    properties:
      # Don't open a DB connection at startup just to read metadata; the dialect is set above
      hibernate.boot.allow_jdbc_metadata_access: false

security:
  # false leaves every endpoint open (deployment window only)
  enforce: ${SECURITY_ENFORCE:true}
  jwt:
    # Set JWT_SECRET (32+ characters) per environment
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:12}
