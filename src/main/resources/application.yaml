server:
  # Elastic Beanstalk's Java SE platform expects port 5000; override with SERVER_PORT
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: erp
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    # Set DB_URL, DB_USERNAME and DB_PASSWORD per environment (EB environment properties, or locally)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
    ddl-auto: update
    show-sql: true
